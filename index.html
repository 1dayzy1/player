<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="container-search">
        <input
          type="text"
          placeholder="Введите название..."
          class="input-search"
        />
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="currentColor"
          class="search"
          viewBox="0 0 16 16"
        >
          <path
            d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"
          />
        </svg>

       
        <div class="container-song">
          
         
        </div>
      </div>

      <div class="player-layout">
        <section class="card upload-card">
          <h2 class="card-title">Загрузить песню</h2>
          <label class="upload-box">
            <input type="file" accept="audio/*,.mp3" id="upload-audio" />
            <span>Нажми или перетащи аудиофайл сюда</span>
          </label>
        </section>

        <section class="card player-card">
          <div class="track-cover">♪</div>

          <div class="track-info">
            <h2 class="song">Название трека</h2>
            <p class="artist">Исполнитель / альбом</p>
          </div>

          <div class="progress-block">
            <div class="progress-time">
              <span class="start">0:00</span>
              <span class="end">0:00</span>
            </div>
            <input
              type="range"
              min="0"
              max="100"
              value="0"
              class="length-audio"
            />
          </div>

          <div class="controls">
            <audio src="" class="audio"></audio>
            <button class="control-btn prev">⏮</button>
            <button class="control-btn play-btn">▶</button>
            <button class="control-btn next">⏭</button>
          </div>

          <div class="volume-block">
            <span>🔊</span>
            <input type="range" min="0" max="100" value="70" class="volume" />
          </div>
        </section>

        <section class="card playlist-card">
          <h2 class="card-title">Все песни</h2>
          <ul class="playlist"></ul>

          <button class="more-track">Показать еще</button>
        </section>
      </div>
    </div>

    <div id="delete-confirmation" class="delete-confirmation hidden">
      <div class="delete-modal">
        <h1 class="delete-not">Трек удален!</h1>
        <p class="text">Точно хотите удалить этот трек?</p>

        <div class="content">
          <div class="track-info-preview">
            <strong id="track-title"></strong><br />
            <span id="track-artist"></span>
          </div>
          <div class="confirmation-buttons">
            <button id="cancel-delete" class="btn cancel-btn">Отмена</button>
            <button id="confirm-delete" class="btn delete-btn">Удалить</button>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
